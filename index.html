<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simons Musikmaskine</title>
<link rel="stylesheet" href="style.css?v=13">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230b0b0d'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='%23c8ff2e' font-family='monospace' font-weight='bold'>S</text></svg>">
</head>
<body>

<header id="top">
  <div id="logo">SIMONS<span>MUSIKMASKINE</span><i id="verTag"></i></div>
  <button id="playBtn" title="Play/Stop (mellemrum)">►</button>
  <button id="fillBtn" title="Hold nede for FILL (eller hold F-tasten)">FILL</button>
  <button id="autoBtn" title="AUTOMATION-OPTAGELSE: mens musikken spiller, skrives dine knap-bevægelser ind — synth-knapper → step-locks i den spillende clip (JAM), MASTER FLT/VOL/PUMP → automations-banerne (SANG)">✳ AUTO</button>
  <button id="recBtn" title="Optag din stemme som audio-clip på det valgte spor (🎧 brug hovedtelefoner). Spiller sangen, starter optagelsen på næste takt">🎙 OPTAG</button>
  <div class="tgroup">
    <label>BPM <input type="number" id="bpm" min="60" max="200" value="132"></label>
    <label>SWING <input type="range" id="swing" min="0" max="0.6" step="0.01" value="0.12"><span id="swingVal">12%</span></label>
    <label>PUMP <input type="range" id="pump" min="0" max="1" step="0.01" value="0.4"><span id="pumpVal">40%</span></label>
  </div>
  <div class="tgroup" id="masterGroup">
    <label class="wide">MASTER FLT <input type="range" id="mFilter" min="0" max="1" step="0.005" value="0.5"><span id="mFilterVal">—</span></label>
    <label>VOL <input type="range" id="mVol" min="0" max="1" step="0.01" value="0.9"></label>
  </div>
  <input id="projName" placeholder="uden titel" maxlength="40" spellcheck="false">
  <button id="saveProj" title="Gem projekt i biblioteket">GEM</button>
  <button id="projMenu" title="Åbn projekt">ÅBN ▾</button>
  <button id="exportBtn" title="Eksportér som WAV">EKSPORT</button>
</header>

<div id="patternBar">
  <span id="viewLabel">JAM</span>
  <button id="viewToggle" title="Skift mellem JAM (session-grid) og SANG (tidslinjen) — Tab">⇄ SANG-VIEW</button>
  <span id="midiBox" title="MIDI-keyboard spiller altid det valgte spors synth"><b id="midiDot">●</b>MIDI
    <button id="midiRec" title="Skriv dine tangenter kvantiseret ind i den valgte clip, mens den looper">⏺ REC</button>
    <button id="midiCap" title="FANG (Capture): skriv det du LIGE har spillet ind i den valgte clip — virker bagudrettet">⭯ FANG</button></span>
  <span class="barHint" id="barHint">Klik en clip = start (på næste takt) · klik tom slot = ny clip · ▶ i højre side = start hel scene</span>
  <div id="songRow">
    <div id="songChain"></div>
    <button id="songAdd" title="Læg den valgte scenes clips ind bagest i sangen (4 takter)">+ SCENE→SANG</button>
    <button id="songLoopBtn" class="on" title="Loop sangen">∞</button>
    <button id="jamBtn" title="Optag din jam (clip- og scene-skift) som sang på tidslinjen">● OPTAG JAM→SANG</button>
  </div>
</div>

<main id="jam">
  <aside id="browser"></aside>
  <div id="session"></div>
</main>
<main id="arr" hidden></main>

<footer id="soundPanel">
  <div id="clipBar" hidden>
    <span id="cbTitle">CLIP</span>
    <input id="cbName" maxlength="14" spellcheck="false" title="Clip-navn">
    <button id="cbLen" title="Clip-længde: 1 eller 2 takter (×2)">16</button>
    <span id="tlenBox" title="Polymeter: clip'ens egen loop-længde i steps">POLY <button id="tlenDec">−</button><b id="tlenVal">16</b><button id="tlenInc">+</button></span>
    <button id="cbTools" title="Værktøjer: euclid, rotér, spejl, tilfældig, ryd">🎲</button>
    <div id="clipSteps" title="Clip'ens steps — redigér mens den looper! Klik = tænd/sluk · shift = blødt · alt = chance · træk lodret = styrke · højreklik = step-lås"></div>
  </div>
  <div id="spHead">
    <span id="spTrack">—</span>
    <span id="lockBadge" hidden>LOCK · STEP <b id="lockStep"></b> <button id="lockClear">RYD LOCK</button> <button id="lockExit">✕</button></span>
    <button id="audition" title="Hør lyden">▷ HØR</button>
  </div>
  <div id="params"></div>
</footer>

<div id="toast" hidden></div>
<div id="projList" hidden><div id="projBox"><div id="projHead">PROJEKTER <button id="projClose">✕</button></div><div id="projItems"></div></div></div>

<script type="module" src="app.js?v=13"></script>
</body>
</html>
